name: tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 0 16 * *'

jobs:
  tests:

    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        node-version: [ 22, 24, 26 ]

    steps:
      - name: Clone the repo
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
        uses: pnpm/setup@v3
        with:
          version: ^12
          runtime: node@${{ matrix.node-version }}
          require-lockfile: true

      - run: pnpm run demo:dev
      - run: pnpm run demo:prod
